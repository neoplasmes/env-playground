apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: dns}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
{{- range $link := list (dict "from" "web" "to" "api" "port" 8080) (dict "from" "api" "to" "processor" "port" 8081) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $link.from }}-to-{{ $link.to }}}
spec:
  podSelector:
    matchLabels: {app: {{ $link.from }}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app: {{ $link.to }}}}}]
      ports: [{protocol: TCP, port: {{ $link.port }}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $link.to }}-from-{{ $link.from }}}
spec:
  podSelector:
    matchLabels: {app: {{ $link.to }}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: {{ $link.from }}}}}]
      ports: [{protocol: TCP, port: {{ $link.port }}}]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: web-from-ingress}
spec:
  podSelector:
    matchLabels: {app: web}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports: [{protocol: TCP, port: 3000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: acme-challenge}
spec:
  podSelector:
    matchLabels: {acme.cert-manager.io/http01-solver: "true"}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: cert-manager}
      ports: [{protocol: TCP, port: 8089}]
