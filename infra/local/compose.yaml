name: env-playground
services:
  image-processor:
    build: {context: ../.., dockerfile: python/apps/image_processor/Dockerfile}
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
  image-api:
    build: {context: ../.., dockerfile: rust/apps/image_api/Dockerfile}
    environment:
      PROCESSOR_URL: http://image-processor:8081
      DATA_DIR: /data
    volumes: [images:/data]
    depends_on:
      image-processor: {condition: service_healthy}
    mem_limit: 384m
  web:
    build: {context: ../.., dockerfile: node/apps/web/Dockerfile}
    environment:
      IMAGE_API_URL: http://image-api:8080
      PUBLIC_ORIGIN: http://localhost:3000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [image-api]
    mem_limit: 512m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  images:
