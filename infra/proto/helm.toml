name = "helm"
type = "cli"
[platform.linux]
checksum-file = "helm-v{version}-{os}-{arch}.tar.gz.sha256sum"
download-file = "helm-v{version}-{os}-{arch}.tar.gz"
exe-path = "helm"
archive-prefix = "{os}-{arch}"
[platform.macos]
checksum-file = "helm-v{version}-{os}-{arch}.tar.gz.sha256sum"
download-file = "helm-v{version}-{os}-{arch}.tar.gz"
exe-path = "helm"
archive-prefix = "{os}-{arch}"
[install]
download-url = "https://get.helm.sh/helm-v{version}-{os}-{arch}.tar.gz"
checksum-url = "https://get.helm.sh/helm-v{version}-{os}-{arch}.tar.gz.sha256sum"
[install.arch]
x64 = "amd64"
[install.os]
macos = "darwin"
[resolve]
versions = ["4.3.0"]
