[project]
name = "repo-style"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["tree-sitter==0.26.0", "tree-sitter-rust==0.24.2"]

[project.scripts]
statement-padding = "repo_style:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_style"]
