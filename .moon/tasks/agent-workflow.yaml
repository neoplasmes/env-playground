$schema: https://moonrepo.dev/schemas/tasks.json
inheritedBy:
  file: AGENT_WORKFLOW.md
tasks:
  check:
    deps: [agents-check]
  agents-install:
    command: bash node/tools/agent-workflow/install.sh
    options: {runFromWorkspaceRoot: true, cache: false}
  agents-check:
    command: bash -c 'pnpm --dir node exec oxlint --config oxlint.config.ts --deny-warnings tools/agent-workflow && pnpm --dir node exec oxfmt --check tools/agent-workflow && bash -n node/tools/agent-workflow/run.sh && bash -n node/tools/agent-workflow/install.sh'
    deps: [agents-install, node-install]
    options: {runFromWorkspaceRoot: true, cache: false}
  terraform-mcp-install:
    command: node node/tools/agent-workflow/install-terraform-mcp.mjs
    options: {runFromWorkspaceRoot: true, cache: false, runInCI: false}
  browser:
    command: bash node/tools/agent-workflow/run.sh playwright-cli
    deps: [agents-install]
    options: {runFromWorkspaceRoot: true, cache: false, runInCI: false}
